<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Drill Tracker – Full Force</title>
<style>
:root{--bg:#0b0d10;--card:#161a20;--card2:#1e242c;--line:#2c343e;--tx:#f4f6f8;--mut:#9aa6b2;--amb:#ffb300;--grn:#2ee07a;--red:#ff5252;--blu:#4fc3f7;--pur:#c792ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#05070a;border-bottom:2px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px}
header .t{flex:1;min-width:0}
header .t b{font-size:17px;color:var(--amb)}
header .t div{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{font-size:13px;font-weight:700;color:var(--grn);text-align:right}
main{padding:10px 10px 110px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#05070a;border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mut);font-size:12px;padding:8px 0 9px;min-height:62px;font-weight:700}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--amb);background:#11151a}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--amb);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:10px 0 6px;font-size:16px;color:var(--blu)}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;background:#0d1014;color:var(--tx);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:19px;min-height:52px}
textarea{min-height:90px;font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amb)}
label.chk{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--tx);min-height:52px}
label.chk input{width:30px;height:30px;min-height:0;margin:0;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 10px;min-height:58px;font-size:18px;font-weight:800;color:#111;background:var(--amb);margin:0 0 10px;cursor:pointer}
.btn:active{transform:scale(.98);filter:brightness(1.2)}
.btn.grn{background:var(--grn);color:#08140c}.btn.red{background:var(--red);color:#fff}.btn.blu{background:var(--blu)}.btn.pur{background:var(--pur)}
.btn.ghost{background:var(--card2);color:var(--tx);border:2px solid var(--line)}
.btn.sm{min-height:46px;padding:8px;font-size:15px;margin:0}
.btn.huge{min-height:110px;font-size:24px;border-radius:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agrid .btn{margin:0;min-height:72px;font-size:16px;background:var(--card2);color:var(--tx);border:2px solid var(--line)}
.agrid .btn span{display:block;font-size:24px}
.big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1.05;letter-spacing:-1px}
.phase{text-align:center;font-size:22px;font-weight:900;letter-spacing:.06em;padding:8px;border-radius:10px;margin-bottom:6px}
.ph-latch{background:#123a52;color:var(--blu)}.ph-drill{background:#0f3d24;color:var(--grn)}.ph-pull{background:#47360a;color:var(--amb)}.ph-pause{background:#3a1d1d;color:var(--red)}.ph-blk{background:#4a1010;color:#ff8a8a}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.segs div{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;color:var(--mut)}
.segs div b{display:block;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}
.segs div.act{outline:3px solid var(--amb)}
.mut{color:var(--mut)}.sm{font-size:14px}.c{text-align:center}.amb{color:var(--amb)}.grn{color:var(--grn)}.red{color:var(--red)}
.li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.li:first-child{border-top:0}
.li .x{flex:1;min-width:0}
.li .x b{display:block}
.li .btn{width:auto;min-width:58px}
.kv{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:7px 0;font-size:16px}
.kv:first-child{border-top:0}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card2);border:2px solid var(--line);color:var(--tx);border-radius:30px;padding:10px 14px;font-size:15px;font-weight:700}
.run-live{border:2px solid var(--grn)}
.pill{display:inline-block;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:800;background:var(--card2);color:var(--amb)}
table{border-collapse:collapse;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px;font-size:14px;text-align:left}
.tbl th{color:var(--amb)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.report{background:#fff;color:#000;border-radius:10px;padding:12px;font-size:14px}
.report h3{margin:0 0 8px;text-align:center;font-size:17px;color:#000}
.report table{margin-bottom:8px}
.report td,.report th{border:1px solid #444;padding:5px 6px;font-size:13px;color:#000;text-align:left}
.report th{background:#e8e8e8}
.report td.n{text-align:right}
.report .lbl{font-weight:700;background:#f2f2f2;width:1%;white-space:nowrap}
.report pre{white-space:pre-wrap;font:13px/1.45 system-ui,Arial;margin:0;border:1px solid #444;padding:6px;min-height:60px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:3px solid var(--amb)}
.sheet h2{margin:0 0 10px;color:var(--amb);font-size:21px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--amb);color:#000;font-weight:800;padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90%}
.warn{background:#3a2a08;border:1px solid var(--amb);border-radius:10px;padding:8px;font-size:14px;margin-bottom:10px}
@media print{
 body{background:#fff}
 header,nav,#toast,#modal,.noprint{display:none!important}
 main{padding:0;max-width:none}
 .card{border:0;padding:0;background:#fff}
 .report{border-radius:0;padding:0}
}
</style>
</head>
<body>
<header><div class="t"><b>⛏ Drill Tracker</b><div id="hsub"></div></div><div class="st" id="hst"></div><button class="btn ghost sm" style="width:auto;min-width:52px" data-a="tab" data-v="settings" aria-label="Settings">⚙</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ===== Utilities ===== */
const KEY='ffdt.v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const r2=n=>Math.round(n*100)/100;
const fm=n=>(n==null||isNaN(n))?'':String(r2(n));
const pad=n=>String(n).padStart(2,'0');
function fdur(ms){ms=Math.max(0,ms||0);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return todayStr(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice=s=>{if(!s)return'';const d=parseD(s);return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`};
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const H=ms=>ms/3.6e6;

/* ===== Constants ===== */
const BUCKETS=['Casing','Coring','Directional','Reaming Rods','Reaming Casing','Rod Pull','Testing','Waterline','Moving','Tear Down/Setup','Hole Stabilizing','CAT','Travel','Repair Maintenance','Standby'];
const FT_ROWS=['Casing','Coring','Reaming Rods','Reaming Casing','Rod Pull','Testing'];
const HR_ROWS=['Directional','Waterline','Moving','Tear Down/Setup','Hole Stabilizing','CAT','Travel','Repair Maintenance','Standby'];
const FROMTO=[['from','From (m)','num'],['to','To (m)','num']];
const ACTS={
 rodpull:{n:'Rod pull',ic:'⬆️',b:'Rod Pull',f:[...FROMTO,['count','# of rods','num']]},
 mech:{n:'Mechanical / repair',ic:'🔧',b:'Repair Maintenance',f:[['desc','What was fixed / serviced','text']]},
 test:{n:'Test / survey',ic:'🧭',b:'Testing',f:[['depth','Test depth (m)','num'],['tool','Tool','text','Omni']]},
 wash:{n:'Washing hole',ic:'💧',b:'Hole Stabilizing',f:[['depth','Depth (m)','num'],['eos','At end of shift (E.O.S.)','check']]},
 standby:{n:'Standby',ic:'⏸️',b:'Standby',f:[['desc','Reason','text']]},
 moving:{n:'Moving',ic:'🚚',b:'Moving',f:[['desc','Details','text']]},
 teardown:{n:'Tear down / setup',ic:'🏗️',b:'Tear Down/Setup',f:[['desc','Details','text']]},
 waterline:{n:'Waterline',ic:'🚰',b:'Waterline',f:[['desc','Details','text']]},
 casing:{n:'Casing',ic:'⭕',b:'Casing',f:[...FROMTO]},
 reamrods:{n:'Reaming rods',ic:'🌀',b:'Reaming Rods',f:[...FROMTO]},
 reamcasing:{n:'Reaming casing',ic:'🌀',b:'Reaming Casing',f:[...FROMTO]},
 stab:{n:'Hole stabilizing',ic:'🧪',b:'Hole Stabilizing',f:[['desc','Mud / cement / details','text']]},
 cat:{n:'CAT',ic:'🚜',b:'CAT',f:[['desc','Details','text']]},
 other:{n:'Other',ic:'📝',b:'Standby',f:[['desc','What','text']]}
};
const DEFMAP=Object.fromEntries(Object.entries(ACTS).map(([k,v])=>[k,v.b]));DEFMAP.preop='Repair Maintenance';
const DEF={driller:'Leo',company:'Full Force Drilling',shift:'Night',size:'NQ',runLen:3,round:0.25,shiftLen:12,travelInShift:true,travel:1,preop:0.5,hitchStart:'',autoNext:true,wake:false,map:DEFMAP,
 quick:'Landing ring,Core lifter,Lifter case,Stop ring,Inner tube head,O-rings,Polymer,Bentonite,Rod grease,Pump packing'};

/* ===== State ===== */
let S;
function load(){
 try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
 if(!S||typeof S!=='object'||!S.days)S={v:1,days:{},cur:null,run:null};
 S.settings=Object.assign(JSON.parse(JSON.stringify(DEF)),S.settings||{});
 S.settings.map=Object.assign({},DEFMAP,S.settings.map||{});
 if(S.cur&&!S.days[S.cur])S.cur=null;
 // v2 migration: directional fields (old cross from/to/m = counted drilled metres; old runs = regular)
 Object.values(S.days).forEach(d=>{if(!d.cross||typeof d.cross!=='object')d.cross={};if(!d.mine||typeof d.mine!=='object')d.mine={};if(d.dirMode==null)d.dirMode=false;
  ['runs','acts','bits','cons'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.runs.forEach(r=>{if(r.dir==null)r.dir=false})});
 if(S.run&&S.run.dir==null)S.run.dir=false;
 if((S.v||1)<2)S.v=2;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ Could not save: '+e.message)}}
const D=()=>S.cur?S.days[S.cur]:null;
const sortedDays=()=>Object.values(S.days).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
const lastDay=()=>sortedDays()[0]||null;
function dayDepth(d){if(!d)return null;return d.curDepth??d.startDepth??null}
let tab='shift',viewDay=null,perOff=0,hitchOff=0,statScope='period';

/* ===== Calculations ===== */
const inc=()=>+S.settings.round||0.25;
const rh=h=>Math.round((h||0)/inc()+1e-9)*inc();
function th(h){if(!h)return'';return String(+rh(h).toFixed(2))}
function fh(h){const v=+rh(h).toFixed(2);let s=String(v);if(v>0&&v<1)s=s.replace(/^0/,'');return s}
function runStats(r){
 const now=Date.now(),o={latch:0,drill:0,pull:0,pause:0};
 (r.segs||[]).forEach(s=>{o[s.t]=(o[s.t]||0)+((s.e||now)-s.s)});
 if(r.ov){['latch','drill','pull'].forEach(k=>{if(r.ov[k]!=null)o[k]=r.ov[k]})}
 o.total=o.latch+o.drill+o.pull;
 o.m=r2(((r.to??r.target)||0)-(r.from||0));
 o.blocks=(r.pieces||[]).filter(p=>p.blocked).length;
 return o;
}
function actH(a){if(a.hrs!=null)return a.hrs;return H((a.e||Date.now())-a.s)}
function crossM(c){if(!c)return 0;if(c.m!=null)return c.m;if(c.from!=null&&c.to!=null)return r2(c.to-c.from);return 0}
const mOf=(m,f,t)=>m!=null?m:(f!=null&&t!=null?r2(t-f):0);
const DIRM=3; // metres credited per directional hour (12 h = 36 m)
function crossCalc(c){c=c||{};const drill=r2(crossM(c)),dirM=r2(mOf(c.dirM,c.dirFrom,c.dirTo)),dir=+c.dir||0,cred=r2(dir*DIRM);return{drill,dirM,dirFrom:c.dirFrom,dirTo:c.dirTo,dir,cred,counted:r2(drill+cred)}}
function mineCalc(d){const runs=d.runs||[],mi=d.mine||{};let reg=0,dirRun=0,dirMs=0,df=null,dt=null;
 runs.forEach(r=>{const st=runStats(r);if(r.dir){dirRun+=st.m;dirMs+=st.total;if(df==null||r.from<df)df=r.from;if(r.to!=null&&(dt==null||r.to>dt))dt=r.to}else reg+=st.m});
 if(mi.dirFrom!=null&&(df==null||mi.dirFrom<df))df=mi.dirFrom;if(mi.dirTo!=null&&(dt==null||mi.dirTo>dt))dt=mi.dirTo;
 const extra=mOf(mi.m,mi.from,mi.to),extraDir=mOf(mi.dirM,mi.dirFrom,mi.dirTo),dir=+d.dir||0,cred=r2(dir*DIRM),drill=r2(reg+extra);
 return{reg:r2(reg),extra:r2(extra),drill,dirRunM:r2(dirRun),dirRunMs:dirMs,dirM:r2(dirRun+extraDir),dirFrom:df,dirTo:dt,dir,cred,counted:r2(drill+cred)}}
const crossLabel=d=>((d&&d.shift==='Day')?'Night':'Day')+' shift';
function dayCalc(d){
 const B={};BUCKETS.forEach(b=>B[b]={h:0,from:null,to:null,m:0,n:0});
 const map=S.settings.map,get=b=>B[b]||(B[b]={h:0,from:null,to:null,m:0,n:0});
 const mm=(o,f,t)=>{if(f!=null&&o.from==null)o.from=f;if(t!=null)o.to=t};
 const runs=d.runs||[];
 const reg=runs.filter(r=>!r.dir),mc=mineCalc(d),mi=d.mine||{};
 reg.forEach(r=>{const st=runStats(r);B.Coring.h+=H(st.total);B.Coring.n++;});
 if(reg.length){B.Coring.from=reg[0].from;B.Coring.to=reg[reg.length-1].to}
 if(mi.from!=null&&(B.Coring.from==null||mi.from<B.Coring.from))B.Coring.from=mi.from;
 if(mi.to!=null&&(B.Coring.to==null||mi.to>B.Coring.to))B.Coring.to=mi.to;
 B.Coring.m=mc.drill;B.Directional.h=mc.dir;
 (d.acts||[]).forEach(a=>{const o=get(map[a.type]||ACTS[a.type]?.b||'Standby');o.h+=actH(a);o.n++;const f=a.f||{};
  if(f.from!=null||f.to!=null){mm(o,f.from,f.to);if(f.from!=null&&f.to!=null)o.m+=Math.abs(f.to-f.from)}});
 B.Travel.h+=d.travel||0;
 get(map.preop||'Repair Maintenance').h+=d.preop||0;
 let total=0;Object.values(B).forEach(o=>total+=o.h);
 return {B,total,coredM:mc.drill,mine:mc};
}
function buildComments(d){
 const L=[],dd=x=>x==null?'?':fm(x);
 if(d.preop)L.push(`-Did pre-op on drill & pump shack (${fh(d.preop)})`);
 const mcx=mineCalc(d);
 if(mcx.dir)L.push(`-Directional drilling (${fm(mcx.dir)} hrs = ${fm(mcx.cred)}m)`);
 if(mcx.dirM)L.push(`-Directional metres${mcx.dirFrom!=null&&mcx.dirTo!=null?` from ${fm(mcx.dirFrom)}m to ${fm(mcx.dirTo)}m`:''} = ${fm(mcx.dirM)}m (not counted)`);
 const items=[];
 (d.acts||[]).forEach(a=>items.push({s:a.s||0,a}));
 (d.runs||[]).forEach(r=>(r.pieces||[]).forEach(p=>{if(p.blocked)items.push({s:p.bt||r.segs[0].s,blk:p})}));
 (d.bits||[]).forEach(b=>items.push({s:b.t||0,bit:b}));
 items.sort((x,y)=>x.s-y.s);
 items.forEach(it=>{
  if(it.blk){L.push(`-Blocked @ ${dd(it.blk.to)}m${it.blk.note?' - '+it.blk.note:''}`);return}
  if(it.bit){const b=it.bit,k=b.kind==='shell'?'shell':'bit';L.push(`-Changed ${k} @ ${dd(b.depth)}m${b.onType||b.onSerial?' (put on '+[b.onType,b.onSerial?'#'+b.onSerial:''].filter(Boolean).join(' ')+')':''}`);return}
  const a=it.a,f=a.f||{},h=`(${fh(actH(a))})`,ds=f.desc?String(f.desc).trim():'';
  let s;
  switch(a.type){
   case'test':s=`-Took test @ ${dd(f.depth)}m with ${f.tool||'Omni'} ${h}`;break;
   case'wash':s=`-Washed hole @ ${f.eos?'E.O.S.':dd(f.depth)+'m'} ${h}`;break;
   case'rodpull':s=`-Pulled ${f.count?f.count+' rods':'rods'} from ${dd(f.from)}m to ${dd(f.to)}m ${h}`;break;
   case'mech':s=`-${ds||'Repair / maintenance'} ${h}`;break;
   case'standby':s=`-Standby${ds?' - '+ds:''} ${h}`;break;
   case'moving':s=`-Moved drill${ds?' - '+ds:''} ${h}`;break;
   case'teardown':s=`-Tear down / setup${ds?' - '+ds:''} ${h}`;break;
   case'waterline':s=`-Worked on waterline${ds?' - '+ds:''} ${h}`;break;
   case'casing':s=`-Ran casing from ${dd(f.from)}m to ${dd(f.to)}m ${h}`;break;
   case'reamrods':s=`-Reamed rods from ${dd(f.from)}m to ${dd(f.to)}m ${h}`;break;
   case'reamcasing':s=`-Reamed casing from ${dd(f.from)}m to ${dd(f.to)}m ${h}`;break;
   case'stab':s=`-Stabilized hole${ds?' - '+ds:''} ${h}`;break;
   case'cat':s=`-CAT${ds?' - '+ds:''} ${h}`;break;
   default:s=`-${ds||'Other'} ${h}`;
  }
  L.push(s);
 });
 String(d.reportNotes||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>L.push(x.startsWith('-')?x:'-'+x));
 return L.join('\n');
}
function bitSummary(d,kind){const on=[],off=[];(d.bits||[]).filter(b=>(b.kind||'bit')===kind).forEach(b=>{if(b.offSerial)off.push(b.offSerial);if(b.onType||b.onSerial)on.push([b.onType,b.onSerial?'#'+b.onSerial:''].filter(Boolean).join(' '))});return{on:on.join(', '),off:off.join(', ')}}
function bitLife(){
 const days=sortedDays().slice().reverse(),rows=[],cur={};
 let latest=null;days.forEach(d=>{const x=dayDepth(d);if(x!=null)latest=x});
 days.forEach(d=>(d.bits||[]).slice().sort((a,b)=>(a.t||0)-(b.t||0)).forEach(b=>{
  const k=b.kind||'bit';

 }));

 days.forEach(d=>{const c=dayCalc(d);o.coredM+=c.coredM;o.total+=c.total;Object.entries(c.B).forEach(([k,v])=>o.B[k]=(o.B[k]||0)+v.h);
  const mc=c.mine;o.dir+=mc.dir;o.cred+=mc.cred;o.dirM+=mc.dirM;o.counted+=mc.counted;o.dirRuns+=(d.runs||[]).filter(r=>r.dir).length;o.runs+=(d.runs||[]).length;(d.runs||[]).forEach(r=>o.blocks+=runStats(r).blocks);

  m.hidden=false;
  const form=$('#mf');
  const collect=()=>{const o={};fields.forEach(f=>{const el=form.elements[f.k];if(!el)return;o[f.k]=f.t==='check'?el.checked:f.t==='num'?num(el.value):el.value});return o};
  const done=v=>{m.hidden=true;m.innerHTML='';res(v);setTimeout(render,0)};
  form.onsubmit=e=>{e.preventDefault();done(collect())};
  $('#mcancel').onclick=()=>done(null);
  if(opt.alt)$('#malt').onclick=()=>{const o=collect();o._alt=true;done(o)};
  const first=form.querySelector('input:not([type=checkbox]),textarea');if(first&&opt.focus!==false)setTimeout(()=>{try{first.focus()}catch(e){}},50);
 });
}

  if(r.pieces.length>1)f.push({k:'pf',l:'Re-run started at / block depth (m)',t:'num',v:last.from});
  const v=await ask('Edit run depths',f);if(!v)return;if(v.from!=null){r.from=v.from;r.pieces[0].from=v.from}if(v.target!=null)r.target=v.target;
  if(r.pieces.length>1&&v.pf!=null){last.from=v.pf;r.pieces[r.pieces.length-2].to=v.pf}save();render()},
 async editDoneRun(el){const d=S.days[el.dataset.d],r=d&&d.runs.find(x=>x.id===el.dataset.v);if(!r)return;const st=runStats(r);
  const v=await ask('Edit run',[{k:'from',l:'From (m)',t:'num',v:r.from},{k:'to',l:'To (m)',t:'num',v:r.to},{k:'latch',l:'Latch time (m:ss)',t:'text',v:mmss(st.latch)},{k:'drill',l:'Drilling time (m:ss)',t:'text',v:mmss(st.drill)},{k:'pull',l:'Pull time (m:ss)',t:'text',v:mmss(st.pull)},{k:'dir',l:'Directional run (doesn\'t count)',t:'check',v:!!r.dir},{k:'del',l:'Delete this run',t:'check'}],{focus:false});
  if(!v)return;
  if(v.del){if(await confirmBox('Delete this run?')){d.runs=d.runs.filter(x=>x!==r);save()}render();return}
  r.dir=!!v.dir;r.from=v.from??r.from;r.to=v.to??r.to;r.pieces[0].from=r.from;r.pieces[r.pieces.length-1].to=r.to;r.ov=r.ov||{};
  ['latch','drill','pull'].forEach(k=>{const ms=pmmss(v[k]);if(ms!=null&&Math.abs(ms-st[k])>=1000)r.ov[k]=ms});
  if(d.runs[d.runs.length-1]===r)d.curDepth=r.to;save();render()},
 async startAct(el){buzz();const type=el.dataset.v,def=ACTS[type];let d=D();if(!d)d=newDayObj();const cur=dayDepth(d);
  const fields=def.f.map(([k,l,t,dv])=>({k,l,t,v:dv??((k==='depth'||k==='from')?cur:null)}));fields.push({k:'notes',l:'Notes',t:'text'});
  const ts=Date.now();
  const v=await ask(def.n,fields,{ok:'▶ Start timer',alt:'Already done – enter hours',focus:false});if(!v)return;
  const f={};def.f.forEach(([k])=>{if(v[k]!==null&&v[k]!==''&&v[k]!==false)f[k]=v[k]});
  const a={id:uid(),type,f,notes:v.notes||'',s:ts,e:null};
  if(v._alt){const hv=await ask(def.n+' – hours',[{k:'h',l:'Hours',t:'num',v:0.5}]);if(!hv||hv.h==null)return;a.hrs=hv.h;a.e=ts}
  else if(S.run&&pauseRun(ts)){a.resumeRun=true;toast('Run paused')}
  d.acts.push(a);save();render()},
 async stopAct(el){buzz();const ts=Date.now();const found=runningActs().find(x=>x.a.id===el.dataset.v);if(!found)return;const a=found.a,def=ACTS[a.type];
  const fields=def.f.map(([k,l,t])=>({k,l,t,v:a.f?.[k]}));fields.push({k:'notes',l:'Notes',t:'text',v:a.notes});
  const v=await ask('Stop '+def.n+' · '+fdur(ts-a.s),fields,{ok:'⏹ Stop & save',focus:false});if(!v)return;
  a.f=a.f||{};def.f.forEach(([k])=>{if(v[k]!==null&&v[k]!==''&&v[k]!==false)a.f[k]=v[k];else delete a.f[k]});a.notes=v.notes||'';a.e=ts;
  if(a.resumeRun&&S.run&&curSeg().t==='pause'){resumeRun(ts);toast('Run resumed')}
  save();render()},
 async editAct(el){const d=S.days[el.dataset.d],a=d&&d.acts.find(x=>x.id===el.dataset.v);if(!a)return;const def=ACTS[a.type];
  const fields=def.f.map(([k,l,t])=>({k,l,t,v:a.f?.[k]}));fields.push({k:'notes',l:'Notes',t:'text',v:a.notes});
  if(a.e||a.hrs!=null)fields.push({k:'hrs',l:'Hours',t:'num',v:r2(actH(a))});
  fields.push({k:'type',l:'Type',t:'select',v:a.type,o:Object.entries(ACTS).map(([k,x])=>[k,x.n])},{k:'del',l:'Delete this entry',t:'check'});
  const v=await ask('Edit '+def.n,fields,{focus:false});if(!v)return;
  if(v.del){if(await confirmBox('Delete this entry?')){d.acts=d.acts.filter(x=>x!==a);save()}render();return}
  a.f=a.f||{};def.f.forEach(([k])=>{if(v[k]!==null&&v[k]!==''&&v[k]!==false)a.f[k]=v[k];else delete a.f[k]});a.notes=v.notes||'';a.type=v.type||a.type;
  if(v.hrs!=null&&Math.abs(v.hrs-r2(actH(a)))>0.004)a.hrs=v.hrs;save();render()},
 async bitChange(el){const kind=el.dataset.v;let d=D();if(!d)d=newDayObj();const cb=curBit(kind);
  const v=await ask(kind==='shell'?'Shell change':'Bit change',[{k:'depth',l:'Depth (m)',t:'num',v:dayDepth(d)},{k:'off',l:'Serial coming OFF (blank if none)',t:'text',v:cb?.serial||''},{k:'type',l:'New '+kind+' type / series',t:'text',v:cb?.type||(kind==='bit'?'Hayden 11':'')},{k:'serial',l:'New serial #',t:'text'}],{focus:false});
  if(!v)return;d.bits.push({kind,depth:v.depth,offSerial:v.off||'',onType:v.type||'',onSerial:v.serial||'',t:Date.now()});save();render()},
 async delBit(el){if(await confirmBox('Delete this bit/shell entry?')){D().bits.splice(+el.dataset.v,1);save()}render()},
 async addCons(el){let item=el.dataset.v;const v=await ask(item||'Consumable',[...(item?[]:[{k:'item',l:'Item',t:'text'}]),{k:'qty',l:'Quantity',t:'num',v:1}],{ok:'Add',focus:!item});if(!v)return;item=item||v.item;if(!item)return;let d=D();if(!d)d=newDayObj();d.cons.push({item,qty:v.qty||1});save();render()},
 async delCons(el){if(await confirmBox('Remove this item?','Remove')){D().cons.splice(+el.dataset.v,1);save()}render()},
 rebuildCmt(){D().comments=null;save();render()},
 copyReport(){copyText(reportText(D()))},
 print(){window.print()},
 openDay(el){viewDay=el.dataset.v;tab='days';window.scrollTo(0,0);render()},
 closeDay(){viewDay=null;render()},
 makeCur(el){S.cur=el.dataset.v;save();viewDay=null;tab='shift';render();toast('Shift opened for editing')},
 async delDay(el){const id=el.dataset.v;if(S.run&&S.run.dayId===id){toast('Finish the running run first');return}
  if(await confirmBox(`Delete shift ${nice(S.days[id].date)}? This cannot be undone.`)){delete S.days[id];if(S.cur===id)S.cur=null;viewDay=null;save()}render()},
 per(el){perOff+=+el.dataset.v;render()},
 hitch(el){hitchOff+=+el.dataset.v;render()},
 scope(el){statScope=el.dataset.v;render()},
 exportJSON(){download(`drill-backup-${todayStr()}.json`,JSON.stringify(S,null,1),'application/json')},
 importJSON(){$('#impfile').value='';$('#impfile').click()},
 csv(el){const k=el.dataset.v,days=sortedDays().slice().reverse();let rows;
  if(k==='days'){rows=[['date','shift','job','hole','size','driller','helper','start_m','end_m','drilled_counts_m','my_dir_h','my_dir_credit_m','counted_total_m','my_dir_metres_not_counted',...BUCKETS.map(b=>b+' h'),'total_h','cross_driller','cross_helper','cross_from','cross_to','cross_m','cross_rodpull','cross_rods','cross_dir_h','cross_dir_credit_m','cross_counted_total_m','cross_dir_from','cross_dir_to','cross_dir_metres_not_counted','consumables','comments','notes']];
   days.forEach(d=>{const c=dayCalc(d),x=d.cross||{};rows.push([d.date,d.shift,d.job,d.hole,d.size,d.driller,d.helper,d.startDepth,dayDepth(d),c.mine.drill,c.mine.dir,c.mine.cred,c.mine.counted,c.mine.dirM,...BUCKETS.map(b=>r2(c.B[b].h)),r2(c.total),x.driller,x.helper,x.from,x.to,crossM(x),x.rodpull?'yes':'no',x.rpCount,x.dir||0,(x.dir||0)*3,crossCalc(x).counted,x.dirFrom,x.dirTo,crossCalc(x).dirM,(d.cons||[]).map(q=>q.item+' x'+q.qty).join('; '),d.comments??buildComments(d),d.notes])})}
  else if(k==='runs'){rows=[['date','hole','run','directional','start_time','from_m','to_m','metres','blocks','block_depths','latch_s','drill_s','pull_s','paused_s','total_s','total_mm:ss']];
   days.forEach(d=>(d.runs||[]).forEach((r,i)=>{const s=runStats(r);rows.push([d.date,d.hole,i+1,r.dir?'yes':'no',new Date(r.segs[0].s).toLocaleString(),r.from,r.to,s.m,s.blocks,r.pieces.filter(p=>p.blocked).map(p=>p.to).join(' '),Math.round(s.latch/1000),Math.round(s.drill/1000),Math.round(s.pull/1000),Math.round(s.pause/1000),Math.round(s.total/1000),fdur(s.total)])}))}
  else{rows=[['date','hole','type','report_line','start','end','hours','from_m','to_m','depth_m','count','tool','desc','eos','notes']];
   days.forEach(d=>(d.acts||[]).forEach(a=>{const f=a.f||{};rows.push([d.date,d.hole,ACTS[a.type]?.n||a.type,S.settings.map[a.type],a.s?new Date(a.s).toLocaleString():'',a.e?new Date(a.e).toLocaleString():'',r2(actH(a)),f.from,f.to,f.depth,f.count,f.tool,f.desc,f.eos?'yes':'',a.notes])}))}
  download(`drill-${k}-${todayStr()}.csv`,csv(rows),'text/csv')},
 async wipe(){if(await confirmBox('Delete ALL shifts and settings? Export a backup first!','Delete everything')&&await confirmBox('Really delete everything?','Yes, wipe')){localStorage.removeItem(KEY);load();render();toast('All data deleted')}}
};
async function finishRun(ts,early){
 const r=S.run;if(!r)return;const last=r.pieces[r.pieces.length-1];
 const v=await ask(early?'End run here':'Run finished',[{k:'to',l:'Depth reached (m)',t:'num',v:early?last.from:r.target}],{ok:'Save run',msg:`Run ${fm(r.from)} → ${fm(r.target)} m · ${fdur(runStats(r).total)}`,focus:false});
 if(!v||v.to==null)return;
 const s=curSeg();if(!s.e)s.e=ts;last.to=v.to;r.to=v.to;r.end=ts;delete r.resume;
 const d=S.days[r.dayId]||D();d.runs.push(r);d.curDepth=v.to;S.run=null;
 if(S.settings.autoNext&&!early&&S.cur===d.id)startRunAt(v.to,ts);
 save();render();toast(`Saved ${fm(r2(v.to-r.from))} m`);
}

/* ===== Events ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();Promise.resolve(f(el)).catch(err=>toast('Error: '+err.message))}});
function onBound(el,isChange){
 if(el.dataset.b!=null){const d=D();if(!d)return;setPath(d,el.dataset.b,elVal(el));
  if(el.dataset.b==='startDepth'&&!(d.runs||[]).length)d.curDepth=null;
  save();updDerived()}
 else if(el.dataset.sb!=null){let v=elVal(el);if(el.dataset.sb==='round')v=+v;setPath(S.settings,el.dataset.sb,v);save();if(el.dataset.sb==='wake')wake();if(isChange&&(el.tagName==='SELECT'||el.dataset.sb==='hitchStart'))render()}
}
document.addEventListener('input',e=>{if(e.target.matches('[data-b],[data-sb]'))onBound(e.target,false)});
document.addEventListener('change',e=>{if(e.target.matches('[data-b],[data-sb]'))onBound(e.target,true)});
function updDerived(){const d=D();if(!d)return;const c=d.cross||{},set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};
 set('dCur',(fm(dayDepth(d))||'—')+' m');const ms=document.getElementById('mineSum'),cs=document.getElementById('crossSum');if(ms)ms.innerHTML=sumKv(mineCalc(d),'m');if(cs)cs.innerHTML=sumKv(crossCalc(c),'c');renderHeader()}
$('#impfile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();let data;try{data=JSON.parse(text)}catch(err){toast('Not a valid backup file');return}
 if(!data||!data.days){toast('Not a Drill Tracker backup');return}
 const v=await ask('Import backup',[{k:'mode',l:'How?',t:'select',v:'merge',o:[['merge','Merge (keep mine, add / overwrite matching days)'],['replace','Replace everything on this phone']]}],{ok:'Import',msg:`${Object.keys(data.days).length} shifts in file.`,focus:false});
 if(!v)return;if(v.mode==='replace'){if(!await confirmBox('Replace ALL data on this phone?','Replace'))return;S=data}else{Object.assign(S.days,data.days)}
 save();load();render();toast('Imported ✔')});
setInterval(()=>{if(!$('#modal').hidden)return;const act=document.activeElement;const typing=act&&/INPUT|TEXTAREA|SELECT/.test(act.tagName);
 if((tab==='timer'||tab==='log')&&(S.run||runningActs().length)&&!typing)render();else renderHeader()},1000);
let wl=null;async function wake(){try{if(S.settings.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){wl=await navigator.wakeLock.request('screen')}else if(!S.settings.wake&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('#modal').hidden){load();render();wake()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&$('#modal').hidden){load();render()}});

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});

load();render();wake();
window.App={S:()=>S,A,dayCalc,agg,stats,reportText,buildComments,periodAt,hitchInfo,runStats,mineCalc,crossCalc,render,setTab:t=>{tab=t;viewDay=null;render()}};
