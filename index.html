<html lang="en">

<title>Drill Tracker – Full Force</title>
<style>
:root{--bg:#0b0d10;--card:#161a20;--card2:#1e242c;--line:#2c343e;--tx:#f4f6f8;--mut:#9aa6b2;--amb:#ffb300;--grn:#2ee07a;--red:#ff5252;--blu:#4fc3f7;--pur:#c792ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#05070a;border-bottom:2px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px}
header .t{flex:1;min-width:0}
header .t b{font-size:17px;color:var(--amb)}
header .t div{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{font-size:13px;font-weight:700;color:var(--grn);text-align:right}
main{padding:10px 10px 140px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#05070a;border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mut);font-size:12px;padding:10px 0 11px;min-height:72px;font-weight:700}
nav button span{display:block;font-size:24px}
nav button.on{color:var(--amb);background:#11151a}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--amb);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:10px 0 6px;font-size:16px;color:var(--blu)}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;background:#0d1014;color:var(--tx);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:19px;min-height:58px}
textarea{min-height:90px;font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amb)}
label.chk{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--tx);min-height:58px}
label.chk input{width:30px;height:30px;min-height:0;margin:0;flex:none}
label.chk.big{font-size:20px;font-weight:800;min-height:72px}label.chk.big input{width:58px;height:58px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 10px;min-height:58px;font-size:18px;font-weight:800;color:#111;background:var(--amb);margin:0 0 10px;cursor:pointer}
.btn:active{transform:scale(.98);filter:brightness(1.2)}
.btn.grn{background:var(--grn);color:#08140c}.btn.red{background:var(--red);color:#fff}.btn.blu{background:var(--blu)}.btn.pur{background:var(--pur)}
.btn.ghost{background:var(--card2);color:var(--tx);border:2px solid var(--line)}
.btn.sm{min-height:58px;padding:10px;font-size:16px;margin:0}
.btn.huge{min-height:110px;font-size:24px;border-radius:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agrid .btn{margin:0;min-height:72px;font-size:16px;background:var(--card2);color:var(--tx);border:2px solid var(--line)}
.agrid .btn span{display:block;font-size:24px}
.big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1.05;letter-spacing:-1px}
.phase{text-align:center;font-size:22px;font-weight:900;letter-spacing:.06em;padding:8px;border-radius:10px;margin-bottom:6px}
.ph-latch{background:#123a52;color:var(--blu)}.ph-drill{background:#0f3d24;color:var(--grn)}.ph-pull{background:#47360a;color:var(--amb)}.ph-pause{background:#3a1d1d;color:var(--red)}.ph-blk{background:#4a1010;color:#ff8a8a}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.segs div{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;color:var(--mut)}
.segs div b{display:block;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}
.segs div.act{outline:3px solid var(--amb)}
.mut{color:var(--mut)}.sm{font-size:14px}.c{text-align:center}.amb{color:var(--amb)}.grn{color:var(--grn)}.red{color:var(--red)}
.li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.li:first-child{border-top:0}
.li .x{flex:1;min-width:0}
.li .x b{display:block}
.li .btn{width:auto;min-width:64px;min-height:58px}
.kv{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:7px 0;font-size:16px}
.kv:first-child{border-top:0}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;background:var(--card2);border:2px solid var(--line);color:var(--tx);border-radius:30px;padding:10px 14px;font-size:15px;font-weight:700;min-height:58px}
.run-live{border:2px solid var(--grn)}
.run-paused{border:2px solid var(--amb)}
.btn.glove{min-height:72px;font-size:20px}
.pill{display:inline-block;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:800;background:var(--card2);color:var(--amb)}
table{border-collapse:collapse;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px;font-size:14px;text-align:left}
.tbl th{color:var(--amb)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.report{background:#fff;color:#000;border-radius:10px;padding:12px;font-size:14px}
.report h3{margin:0 0 8px;text-align:center;font-size:17px;color:#000}
.report table{margin-bottom:8px}
.report td,.report th{border:1px solid #444;padding:5px 6px;font-size:13px;color:#000;text-align:left}
.report th{background:#e8e8e8}
.report td.n{text-align:right}
.report .lbl{font-weight:700;background:#f2f2f2;width:1%;white-space:nowrap}
.report pre{white-space:pre-wrap;font:13px/1.45 system-ui,Arial;margin:0;border:1px solid #444;padding:6px;min-height:60px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:3px solid var(--amb)}
.sheet h2{margin:0 0 10px;color:var(--amb);font-size:21px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--amb);color:#000;font-weight:800;padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90%}
.drvban{display:block;width:100%;text-align:left;color:var(--tx);min-height:58px;font-size:16px;font-weight:700;cursor:pointer}
.hitchbar{display:flex;align-items:center;gap:8px;background:#1b1530;border:2px solid var(--pur);border-radius:12px;padding:8px 10px;margin:0 0 12px;font-weight:800;font-size:17px}
.hitchbar.day{background:#2b220a;border-color:var(--amb)}.hitchbar.off{background:#0f2a1a;border-color:var(--grn)}
.hitchbar .x{flex:1}.hitchbar .btn{width:auto;min-width:58px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:4px}
.calcard{padding:8px 3px;margin:0 -8px 12px} /* 360 px phone: 7 cells ≈ 48 px each */.calcard h3{margin:2px 6px 6px}
.cal .hd{font-size:12px;color:var(--mut);text-align:center;font-weight:700}
.cal button{min-height:58px;min-width:0;width:100%;border-radius:7px;border:2px solid var(--line);background:var(--card2);color:var(--mut);font-size:15px;font-weight:800;padding:1px 0;line-height:1.1;white-space:nowrap;overflow:visible}
.cal button small{display:block;font-size:11px;font-weight:700;letter-spacing:-.02em}
.cal .wn{background:#2a1f4a;color:#e3d4ff;border-color:#5b44a0}.cal .wd{background:#4a3708;color:#ffe08a;border-color:#a57c10}.cal .of{background:#0f2a1a;color:#8fe3b0;border-color:#1f5a36}
.cal .ov{border-style:dashed;border-color:#fff}.cal .td{outline:3px solid var(--red);outline-offset:-1px}
.legend span{display:inline-block;padding:2px 8px;border-radius:8px;margin:0 6px 6px 0;font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.pick .chip.on{background:var(--amb);color:#111;border-color:var(--amb)}
.pm{display:flex;align-items:center;gap:8px;margin:0 0 10px}.pm .btn{width:72px;min-height:64px;font-size:28px;margin:0}.pm .v{flex:1;text-align:center;font-size:34px;font-weight:900}
.rcres{font-size:44px;font-weight:900;text-align:center;border-radius:12px;padding:8px;margin:0 0 10px}
input.bad{border-color:var(--red,#e33)!important;outline:2px solid #e33}.rcres.ok{background:#0f3d24;color:var(--grn)}.rcres.bad{background:#4a1010;color:#ff8a8a}
.bfrow{border:2px solid var(--line);border-radius:12px;padding:10px;margin:0 0 12px}
.bfrow .err{color:var(--red);font-weight:700;font-size:14px}
.pill.bf{color:var(--blu)}.pill.red{color:var(--red)}
.warn{background:#3a2a08;border:1px solid var(--amb);border-radius:10px;padding:8px;font-size:14px;margin-bottom:10px}
#toast.big{font-size:22px;padding:20px 24px;bottom:45%;border:3px solid #111;text-align:center;min-width:70%}
.bitalert{border:3px solid var(--red);background:#4a1010}.bitalert .btn{margin:8px 0 0}
.bfwho{font-weight:800;font-size:14px;margin:4px 0}.bfwho.me{color:var(--grn)}.bfwho.cr{color:var(--blu)}
.tbl td,.tbl th{padding:4px 6px}
.sprint{background:#fff;color:#111;border-radius:10px;padding:14px;margin:0 0 12px}.sprint table{width:100%;border-collapse:collapse}.sprint td,.sprint th{border:1px solid #999;padding:4px 6px;text-align:left;color:#111}.sprint h3,.sprint h2{color:#111}
@media print{
 body{background:#fff}
 header,nav,#toast,#modal,.noprint{display:none!important}
 main{padding:0;max-width:none}
 .card{border:0;padding:0;background:#fff}
 .report{border-radius:0;padding:0}
 .sprint{padding:0;border-radius:0}
}
/* v6.5 Days grid */
.dg{display:grid;grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 46px;gap:4px;width:100%;align-items:center;text-align:left}
.dgh{font-size:13px;color:var(--mut);padding:0 6px 6px;font-weight:700}
.dgr{min-height:64px;background:var(--card2);border:2px solid var(--line);border-radius:10px;color:var(--tx);padding:6px;margin:0 0 6px;font:inherit;cursor:pointer}
.dgr.fut{opacity:.45}.gd{font-size:13px;line-height:1.3}.gc{min-width:0;padding:2px 4px;border-radius:6px;overflow-wrap:anywhere}.gc.me{background:rgba(255,179,0,.10)}
.gn{font-size:14px;line-height:1.25}.gm{font-size:20px;font-weight:800}.gt{font-size:15px;font-weight:800;text-align:right}
.gro{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;font-size:16px}
/* == v6.7 RPM begin */
.rpmvid{display:block;width:100%;max-height:50vh;background:#000;border-radius:10px;margin:0 0 8px}
.big.rpmtime{font-size:30px;margin:0 0 6px}
input.rpmscrub{padding:0;border:0;background:none;min-height:58px;margin:0 0 10px}
.btn.rpmpick{text-align:center;color:#111;font-size:18px;font-weight:800;margin:0 0 10px}.btn.ghost.rpmpick{color:var(--tx)}
.rcres.mid{background:#47360a;color:var(--amb)}
.segs div.tap{cursor:pointer;min-height:64px;border:2px dashed var(--line)}.segs div.tap.act{border-color:var(--amb)}
.chip.tchip{padding:6px 12px;font-size:15px}
#mf input[name=tileV]{font-size:40px;min-height:80px;text-align:center;font-weight:900}
/* == v6.7 RPM end */
</style>
</head>
<body>
<header><div class="t"><b>⛏ Drill Tracker</b><div id="hsub"></div></div><div class="st" id="hst"></div><button class="btn ghost sm" style="width:auto;min-width:58px;min-height:58px" data-a="tab" data-v="settings" aria-label="Settings">⚙</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<script>
'use strict';
/* ===== Utilities ===== */
const KEY='ffdt.v1';
/* Google Drive backup: paste the OAuth "Web application" client ID from Google Cloud Console here
   (looks like 1234-abc.apps.googleusercontent.com). Leave '' to keep Drive backup switched off. */
const GDRIVE_CLIENT_ID = '';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const r2=n=>Math.round(n*100)/100;
const fm=n=>(n==null||isNaN(n))?'':String(r2(n));
const pad=n=>String(n).padStart(2,'0');
function fdur(ms){ms=Math.max(0,ms||0);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return todayStr(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WD2=['Su','Mo','Tu','We','Th','Fr','Sa'];
const nice=s=>{if(!s)return'';const d=parseD(s);return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`};
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const H=ms=>ms/3.6e6;
const plural=(n,w,pl)=>`${n} ${n===1||n==='1'?w:(pl||w+'s')}`;

/* ===== Constants ===== */
const BUCKETS=['Casing','Coring','Directional','Reaming Rods','Reaming Casing','Reaming','Rod Pull','Testing','Waterline','Moving','Tear Down/Setup','Hole Stabilizing','CAT','Travel','Repair Maintenance','Standby','Waiting for water'];
const OPT_ROWS=['Waiting for water']; // v6.1: shown on the report only when it has hours, so older reports stay exactly the same
const FT_ROWS=['Casing','Coring','Reaming Rods','Reaming Casing','Reaming','Rod Pull','Testing'];
const HR_ROWS=['Directional','Waterline','Moving','Tear Down/Setup','Hole Stabilizing','CAT','Travel','Repair Maintenance','Standby'];
const FROMTO=[['from','From (m)','num'],['to','To (m)','num']];
const ACTS={
 rodpull:{n:'Pulling rods (trip out)',ic:'⬆️',b:'Rod Pull',f:[['depth','Depth (m)','num'],['count','# of rods out','num']]},
 rodin:{n:'Lowering rods (trip in)',ic:'⬇️',b:'Rod Pull',f:[['depth','Depth (m)','num'],['count','# of rods in','num']]},
 rodsetup:{n:'Setting up for rod pull',ic:'🧰',b:'Rod Pull',f:[['depth','Depth (m)','num']]},
 mech:{n:'Mechanical / repair',ic:'🔧',b:'Repair Maintenance',f:[['desc','What was fixed / serviced','text']]},
 breakdown:{n:'Breakdown / repair',ic:'💥',b:'Repair Maintenance',f:[['desc','What broke','text']]},
 water:{n:'Waiting for water',ic:'⏳',b:'Waiting for water',f:[]},
 test:{n:'Test / survey',ic:'🧭',b:'Testing',f:[['depth','Test depth (m)','num'],['tool','Tool','text','Omni']]},
 wash:{n:'Washing hole',ic:'💧',b:'Hole Stabilizing',f:[['depth','Depth (m)','num'],['eos','At end of shift (E.O.S.)','check']]},
 standby:{n:'Standby',ic:'⏸️',b:'Standby',f:[['desc','Reason','text']]},
 foreman:{n:'Foreman on site / time with foreman',ic:'👷',b:'Standby',f:[['desc','Talked about / notes','text']]},
 moving:{n:'Moving',ic:'🚚',b:'Moving',f:[['desc','Details','text']]},
 teardown:{n:'Tear down / setup',ic:'🏗️',b:'Tear Down/Setup',f:[['desc','Details','text']]},
 waterline:{n:'Waterline',ic:'🚰',b:'Waterline',f:[['desc','Details','text']]},
 casing:{n:'Casing',ic:'⭕',b:'Casing',f:[...FROMTO]},
 reamrods:{n:'Reaming rods',ic:'🌀',b:'Reaming Rods',f:[...FROMTO]},
 reamcasing:{n:'Reaming casing',ic:'🌀',b:'Reaming Casing',f:[...FROMTO]},
 ream:{n:'Reaming',ic:'🔩',b:'Reaming',f:[...FROMTO,['passes','Passes (optional)','num'],['depth','Depth if no from/to (m)','num']]},
 stab:{n:'Hole stabilizing',ic:'🧪',b:'Hole Stabilizing',f:[['desc','Mud / cement / details','text']]},
 cat:{n:'CAT',ic:'🚜',b:'CAT',f:[['desc','Details','text']]},
 other:{n:'Other',ic:'📝',b:'Standby',f:[['desc','What','text']]}
};
const DEFMAP=Object.fromEntries(Object.entries(ACTS).map(([k,v])=>[k,v.b]));DEFMAP.preop='Repair Maintenance';
const DEF={driller:'Leo',company:'Full Force Drilling',shift:'Night',size:'NQ',runLen:3,round:0.25,shiftLen:12,travelInShift:true,travel:1,preop:0.5,hitchStart:'',hitchShift:'Night',shiftCutoff:8,autoNext:true,wake:false,drivePending:false,driveLast:null,driveConsented:false,
 crewList:'James,Manny',lastCrew:[],drillerNames:[],paceTarget:null,rodLen:3,barrelLen:3,barrelOn:true,standSize:2,
 hitchOn:28,hitchOff:14,rotaAnchors:[],rotaDayOv:{},rotaTypeOv:{},map:DEFMAP,
 myName:'Leo',showCrewInShare:false,reamCountsAsDrilled:false,drillNumber:'',drillType:'A5',bitAlertsOn:true,slowPct:40,bitLifeM:null,helperNames:[],bitLifeDismissed:{},
 quick:'Landing ring,Core lifter,Lifter case,Stop ring,Inner tube head,O-rings,Polymer,Bentonite,Rod grease,Pump packing'};

/* ===== State ===== */
let S;
let loadError=null;
const PRE6_KEY='ffdt.pre6',PRE6_META='ffdt.pre6.meta',PRE6_CUR='ffdt.pre6.cur';
const SAFE0='ffdt.safe0',SAFE0_META='ffdt.safe0.meta',SAFE0_CUR='ffdt.safe0.cur';
const FIX_KEY='ffdt.fixundo'; // v6.1 QA62-7: the one "Undo fix" – its own key, never inside ffdt.v1, dropped first when storage is full
const IMP_CUR='ffdt.imp.cur'; // v6.1 QA-R5: your data from just before the last import (+ '.meta')
const badHrs=h=>h!=null&&(!(h>=0)||h>24),HRS_MSG='Hours must be 0–24'; // v6.1: one check for every typed hours box
const isQuota=e=>!!e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014||/quota/i.test(String(e.message||'')));
let storeWarn=null; // v6.1: storage-full warning stays on screen (banner) until dismissed
const STORE_FULL='⚠ Phone storage is full – a safety copy could not be saved. Your shifts are still saved. Export a backup now (Settings → Export backup).';
// Write a safety copy (+ meta). On failure: remove the half-written copy, warn clearly, return false. Never touches ffdt.v1.
function storeSafe(key,val,metaKey,meta){try{localStorage.setItem(key,val);if(metaKey)localStorage.setItem(metaKey,JSON.stringify(meta))}catch(e){try{localStorage.removeItem(key);if(metaKey)localStorage.removeItem(metaKey)}catch(x){}const msg=isQuota(e)?STORE_FULL:'⚠ Could not save a safety copy ('+(e&&e.message||'error')+'). Export a backup now.';storeWarn=msg;try{toast(msg,true)}catch(x){}return false}return true}
// v6.1: one shared "oldest safe copy" – the raw phone data from before the FIRST destructive action of any kind. Written only if absent; never overwritten.
// Returns true when the copy exists or there is nothing readable to keep; false only when a needed copy could not be written.
// QA11: only readable Drill Tracker data goes in – unreadable data is never stored here (it stays in ffdt.v1 / ffdt.v1.bak).
function safe0Valid(raw){try{const o=JSON.parse(raw);return !!o&&typeof o==='object'&&!!o.days&&typeof o.days==='object'&&!Array.isArray(o.days)}catch(e){return false}}
function takeSafe0(reason){try{if(localStorage.getItem(SAFE0)!=null)return true}catch(e){return false}

/* ===== v6.3: Oil change / weekly maintenance =====
 Leo: "a button for oil changes – drill, pump shack and motor date changed – and a checkmark, once a week on Sundays".
 S.maint={log:[{id,item:'drill'|'pump'|'motor',date:'YYYY-MM-DD',note,savedAt}],dismissed:'YYYY-MM-DD'|null}.
 A week runs Sunday→Saturday; an entry belongs to the week that contains its date. This week's checkmarks are read from the log
 (no stored flag that could drift), so they reset by themselves each Sunday. "Today" is the app's work date (workDate: a night
 shift keeps its start date until the 08:00 cut-off), so a Sunday night shift sees the reminder all night, also after midnight.
 Not on the printed / shared report. */
const MAINT_IT=[['drill','Drill'],['pump','Pump shack'],['motor','Motor']],MAINT_N=Object.fromEntries(MAINT_IT);
const isYmd=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(parseD(s));
const weekStart=s=>addDays(s,-parseD(s).getDay()); // the Sunday of that week
const mLog=()=>(S&&S.maint&&Array.isArray(S.maint.log)?S.maint.log:[]).filter(e=>e&&typeof e==='object'&&MAINT_N[e.item]&&isYmd(e.date));
function maintWeek(ws){const o={};mLog().forEach(e=>{if(weekStart(e.date)!==ws)return;const p=o[e.item];if(!p||(+e.savedAt||0)>=(+p.savedAt||0))o[e.item]=e});return o}
const maintDone=ws=>{const w=maintWeek(ws);return MAINT_IT.every(([k])=>w[k])};
const maintSort=(a,b)=>b.date.localeCompare(a.date)||(+b.savedAt||0)-(+a.savedAt||0);
const maintLast=k=>mLog().filter(e=>e.item===k).sort(maintSort)[0]||null;
const mDay=s=>{const d=parseD(s);return `${MON[d.getMonth()]} ${d.getDate()}`};
const agoTxt=(s,today)=>{const n=Math.round((parseD(today)-parseD(s))/864e5);return n===0?'today':n===1?'1 day ago':n>0?`${n} days ago`:`in ${-n} day${n===-1?'':'s'}`};
function maintEnsure(){if(!S.maint||typeof S.maint!=='object'||Array.isArray(S.maint))S.maint={log:[],dismissed:null};if(!Array.isArray(S.maint.log))S.maint.log=[];return S.maint}
// v6.4 (QA66-b): an entry with no id gets one made from its own content (item, date, note, savedAt), so the same id-less entry
// imported twice gets the same id and the merge overwrites it instead of adding a copy. A clash inside one log gets a -2, -3… suffix.
function maintIdOf(e){const t=[e.item,e.date,String(e.note==null?'':e.note),+e.savedAt||0].join('|');let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return 'mx'+h.toString(36)}
function maintIds(log){if(!Array.isArray(log))return log;const used=new Set(log.filter(e=>e&&typeof e==='object'&&e.id!=null&&e.id!=='').map(e=>String(e.id)));
 log.forEach(e=>{if(!e||typeof e!=='object'||(e.id!=null&&e.id!==''))return;const b=maintIdOf(e);let id=b,n=1;while(used.has(id))id=b+'-'+(++n);e.id=id;used.add(id)});return log}
// v6.4 (QA66-a): one entry per item per week – keep the newest (savedAt; on a tie the later one in the log). keys = optional Set of 'item|weekStart' to limit it.
function maintDedupe(log,keys){if(!Array.isArray(log))return log;const best=new Map();
 log.forEach((e,i)=>{if(!e||typeof e!=='object'||!MAINT_N[e.item]||!isYmd(e.date))return;const k=e.item+'|'+weekStart(e.date);if(keys&&!keys.has(k))return;const b=best.get(k);if(b===undefined||(+e.savedAt||0)>=(+log[b].savedAt||0))best.set(k,i)});
 const keep=new Set(best.values());return log.filter((e,i)=>{if(!e||typeof e!=='object'||!MAINT_N[e.item]||!isYmd(e.date))return true;const k=e.item+'|'+weekStart(e.date);if(keys&&!keys.has(k))return true;return keep.has(i)})}
let maintHistOpen=false,maintFilter='all';
function maintBanner(){try{const wd=workDate();if(parseD(wd).getDay()!==0)return '';const ws=weekStart(wd);if(maintDone(ws)||(S.maint&&S.maint.dismissed===wd))return '';const w=maintWeek(ws);
 return `<div class="warn" id="maintBanner" style="padding:10px"><button class="btn glove" data-a="maintOpen" id="maintBannerBtn" style="margin:0 0 8px">🛢 Sunday oil change: ${MAINT_IT.map(([k,n])=>`${n} ${w[k]?'☑':'☐'}`).join(' ')}</button><button class="btn ghost" data-a="maintDismiss" id="maintDismiss" style="margin:0">Not today</button></div>`}catch(e){return ''}}

 <p class="sm" id="maintWeek">This week ${esc(mDay(ws))}–${esc(mDay(addDays(ws,6)))}: ${MAINT_IT.map(([k,n])=>`${esc(n)} ${w[k]?'☑':'☐'}`).join(' · ')}</p>
 <div id="maintLast">${MAINT_IT.map(([k,n])=>{const e=maintLast(k);return `<div class="kv"><span>${esc(n)}: ${e?`last changed ${esc(mDay(e.date))} (${esc(agoTxt(e.date,wd))})`:'no change saved yet'}</span></div>`}).join('')}</div>

async function maintOpen(){buzz();const wd=workDate(),ws=weekStart(wd),w=maintWeek(ws),fields=[],maxD=[wd,todayStr(new Date(Date.now()))].sort().pop(); // v6.4 (QA66-c): the date picker stops at max(work date, today)
 MAINT_IT.forEach(([k,n])=>{const e=w[k];fields.push({k:'c_'+k,l:'✔ '+n+' changed',t:'check',v:!!e,cls:'big'},{k:'d_'+k,l:`${n}: date changed`,t:'date',v:e?e.date:wd,max:maxD},{k:'n_'+k,l:`${n}: note (oil used, hour meter) – optional`,t:'text',v:e?String(e.note||''):''})});
 const v=await ask('🛢 Oil change',fields,{ok:'Save',focus:false,msg:`<div id="maintSheetInfo">Week ${esc(mDay(ws))}–${esc(mDay(addDays(ws,6)))} (Sun–Sat). Tick what you changed.</div>`});if(!v)return;
 for(const[k,n]of MAINT_IT)if(v['c_'+k]){const d=String(v['d_'+k]||'').trim();if(!isYmd(d)){toast(`Enter the date the ${n} oil was changed – nothing saved`,true);return}if(d>maxD){toast(`${n}: the date can't be in the future – nothing saved`,true);return}}

 if(rm.length)doRm=!!await ask('Remove this week\'s check?',[],{ok:'Remove',danger:true,focusCancel:true,msg:`<div id="maintRmMsg">Deletes the saved oil change for ${rm.map(([k,n])=>`${esc(n)} (${esc(nice(w[k].date))})`).join(', ')}. The others are saved either way.</div>`});
 const M=maintEnsure(),now=Date.now();let n=0;
 const touched=new Set();
 MAINT_IT.forEach(([k])=>{if(!v['c_'+k])return;const d=String(v['d_'+k]).trim(),note=String(v['n_'+k]||'').trim(),e=w[k];
  if(e){if(e.date!==d||String(e.note||'')!==note){e.date=d;e.note=note;e.savedAt=now;n++;touched.add(k+'|'+weekStart(d))}}else{M.log.push({id:uid(),item:k,date:d,note,savedAt:now});n++;touched.add(k+'|'+weekStart(d))}});
 // v6.4 (QA66-a): a date edit that lands in a week that already has that item keeps only the newest (the one just saved); this week's items are cleaned too
 MAINT_IT.forEach(([k])=>{if(v['c_'+k])touched.add(k+'|'+ws)});
 if(touched.size){const L0=M.log.length;M.log=maintDedupe(M.log,touched);if(M.log.length!==L0)n++}
 // v6.4 (QA66-a): unticking removes ALL of that item's entries in this week (not just the newest), so the check really goes away
 if(doRm)rm.forEach(([k])=>{const L0=M.log.length;M.log=M.log.filter(e=>!(e&&typeof e==='object'&&e.item===k&&isYmd(e.date)&&weekStart(e.date)===ws));if(M.log.length!==L0)n++});
 if(!n){toast('Nothing changed');render();return}
 save();render();toast('✔ Oil change saved'+(maintDone(weekStart(workDate()))?' – all 3 done this week':''))}
async function maintDel(id){const M=maintEnsure(),e=M.log.find(x=>x&&String(x.id)===String(id));if(!e)return;

function curSeg(){return S.run.segs[S.run.segs.length-1]}
function openSeg(t,p,ts){S.run.segs.push({t,p,s:ts,e:null})}
function pauseRun(ts=Date.now()){if(!S.run)return false;const s=curSeg();if(s.t==='pause'||s.e!=null)return false;s.e=ts;S.run.resume=s.t;openSeg('pause',s.p,ts);return true}
function resumeRun(ts=Date.now()){if(!S.run)return;const s=curSeg();if(s.t!=='pause'||s.e!=null)return;s.e=ts;openSeg(S.run.resume||'drill',s.p,ts)}
// v6.1 QA4/5: who is holding a pause is a SET. S.run.holds = ids of live timers holding the run paused; x.pausedBy = ids holding timer x paused.
// The run / timer only resumes when its set is empty, so with Breakdown + Water overlapping, stopping one hands the pause to the one still running.

const bitAlertVib=new Set();
function liveRunM(r){if(!r)return null;if(r.nowDepth!=null&&isFinite(+r.nowDepth))return r2(+r.nowDepth-r.from);
 const blk=(r.pieces||[]).filter(p=>p.blocked&&p.to!=null);if((r.segs||[]).some(s=>s.t==='pull'))return r2((r.to??(blk.length?Math.max(...blk.map(p=>p.to)):r.target))-r.from);return null}
function bitRuns(bit,exclude){const out=[];if(!bit)return out;allDays().forEach(d=>(d.runs||[]).forEach(r=>{if(r&&r.bitId===bit&&r.id!==exclude&&r.to!=null)out.push(r)}));return out}
function bitAvg(bit,exclude){let m=0,h=0,n=0;bitRuns(bit,exclude).forEach(r=>{const st=runStats(r),dh=H(st.drill);if(st.m>0&&dh>0){m+=st.m;h+=dh;n++}});return{n,rate:n>=3&&h>0?m/h:null}}
function bitTotalM(bit){let m=bitRuns(bit,S.run&&S.run.id).reduce((t,r)=>t+Math.max(0,runStats(r).m),0);if(S.run&&S.run.bitId===bit){const x=liveRunM(S.run);if(x>0)m+=x}return r2(m)}
function bitAlerts(){const st=S.settings,out=[];if(st.bitAlertsOn===false)return out;const r=S.run,d=D();
 const bit=(r&&r.bitId)||(d&&d.bitId!=null&&String(d.bitId).trim())||null;if(!bit)return out;
 if(r&&r.bitId&&!r.slowDismissed){const rs=runStats(r),m=liveRunM(r);
  if(rs.drill>=600000&&m!=null&&m>=0.5){const av=bitAvg(r.bitId,r.id);let pct=+st.slowPct;if(!(pct>0&&pct<100))pct=40;
   if(av.rate){const live=m/H(rs.drill);if(live<=av.rate*(1-pct/100))out.push({k:'slow',bit:r.bitId,live:r2(live),avg:r2(av.rate),pct,msg:`Slow bit: ${fm(r2(live))} m/hr this run vs ${fm(r2(av.rate))} m/hr average for bit ${r.bitId} (${Math.round(100-live/av.rate*100)}% slower)`})}}}
 const lim=+st.bitLifeM;if(lim>0&&!(st.bitLifeDismissed||{})[bit]){const tot=bitTotalM(bit);if(tot>lim)out.push({k:'life',bit,total:tot,lim,msg:`Bit ${bit} has ${fm(tot)} m – past the ${fm(lim)} m bit life`})}
 return out}
function bitAlertHtml(){const al=bitAlerts();
 const r=S.run,showNow=r&&r.bitId&&S.settings.bitAlertsOn!==false;
 al.forEach(a=>{const key=a.k+':'+(a.k==='slow'?(r&&r.id):a.bit);if(!bitAlertVib.has(key)){bitAlertVib.add(key);try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}}});
 return al.map(a=>`<div class="card bitalert" id="bitAlert-${a.k}"><b>⚠ ${esc(a.msg)}</b><button class="btn" data-a="bitDismiss" data-v="${a.k}" id="bitDismiss-${a.k}">✖ Dismiss${a.k==='slow'?' for this run':' for this bit'}</button></div>`).join('')
  +(showNow?`<div class="card" id="bitNow"><label>Depth now (optional – lets the slow-bit check run while drilling) · bit ${esc(r.bitId)}<input data-rn="nowDepth" type="number" inputmode="decimal" step="any" value="${esc(r.nowDepth??'')}" autocomplete="off"></label></div>`:'')}
function bitDismiss(k){const al=bitAlerts().find(a=>a.k===k);if(k==='slow'&&S.run)S.run.slowDismissed=true;else if(k==='life'){const bit=al?al.bit:((S.run&&S.run.bitId)||(D()&&D().bitId));if(bit){S.settings.bitLifeDismissed=S.settings.bitLifeDismissed||{};S.settings.bitLifeDismissed[bit]=true}}save();render();toast('Alert dismissed')}

// == v6.7 RPM begin (main block: RPM counter + rpi calculator; Leo: "Lets build one into the app")
/* Video RPM counter + rpi calculator. Reached from the Log tab ("⚙ RPM & rpi tool"). The video is kept in memory only
   (URL.createObjectURL – never stored); the counter's settings and readings live in memory too. The only data change:
   "Save to shift" adds {t,rpm,rpi,rate} to day.rpm. The field is optional: missing = no readings (read through rpmOf), so old data
   loads byte-identical and nothing is written on load; the load-time check only resets a day.rpm that isn't a list. Deleting the
   last reading removes the field again, so the day is exactly as before. Export / Import / Drive backup carry it with the day. */
const RPM_LO=100,RPM_HI=1300,IN_M=39.37007874015748;
const rpmOf=d=>d&&Array.isArray(d.rpm)?d.rpm:[];
function rpmDefault(){if(!S||S._corrupt||!S.days||typeof S.days!=='object')return;allDays().forEach(d=>{if('rpm' in d&&!Array.isArray(d.rpm))d.rpm=[]})}
const rpmStrip=d=>{if(d&&Array.isArray(d.rpm)&&!d.rpm.length){const c=Object.assign({},d);delete c.rpm;return c}return d}; // safety-copy compare: no readings = same as before v6.7

function rpmCalc(videoSec,turns,capFps,fileFps){const dt=Math.abs(+videoSec),n=+turns,c=+capFps,f=+fileFps;

/* -- v6.7 Stopwatch (Leo approved via Drill Mentor): standalone, one tap from the RPM tool and the Log tab. It never touches the shift,
   the run / activity timers, ffdt.v1 or pay. Its own key ffdt.sw = {s: start Date.now() or null, acc: ms banked before the last start,
   laps: [ms], in: inches typed}. Time shown = acc + (now − s), from timestamps, so it stays right through a screen lock, background or reload. */
const SW_KEY='ffdt.sw';

function swFmt(ms){ms=Math.max(0,ms||0);const t=Math.floor(ms/100),ds=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600)%60,h=Math.floor(t/36000);return `${h?h+':'+pad(m):m}:${pad(s)}.${ds}`}
function swRateHtml(){const o=swGet(),r=o.s==null?swRate(o.in,swMs(o)):null;

  :'<p class="mut sm" id="swIpm">Enter the inches advanced to see in/min and m/hr.</p>'}

  <div class="big" id="swTime">${swFmt(ms)}</div><p class="c sm ${run?'grn':'mut'}" id="swState">${run?'● running':ms?'⏸ stopped':'ready'}</p>
  ${run?`<button class="btn huge red" data-a="swStop" id="swStop">■ STOP</button><button class="btn ghost glove" data-a="swLap" id="swLap">🏁 Lap</button>`
   :`<button class="btn huge grn" data-a="swStart" id="swStart">▶ ${ms?'START (carry on)':'START'}</button>${ms||o.laps.length?'<button class="btn ghost glove" data-a="swReset" id="swReset">↺ Reset</button>':''}`}

/* -- v6.7 Tile fix (Leo approved via Drill Mentor): tap Latch / Drill / Pull on the Timer screen (live run) or L / D / P on a finished run
   and type the real time. The run's Total never changes: the difference moves to the neighbour step – Latch ↔ Drill, Drill ↔ Pull,
   and Pull ↔ Drill (Pull has no next step). Same idea as the v6.1 "Fix: it really ended after…": the step boundary moves in the run's
   own timeline (segs), active time is just relabelled, pause segments keep their exact times, and the edit gets the one Undo fix
   (fixBegin / fixCommit). No new data fields, so no migration; the shared calc (runStats → dayCalc / agg / stats) reads it as usual.
   Only the current piece is changed (time from before a block stays as it is); a blocked tube's Drill/Pull boundary is not moved.
   A finished run that already has typed times (r.ov, from ✎ Edit run) gets the change in those typed times, total kept. */
const TILE_PAIR={latch:['latch','drill'],drill:['drill','pull'],pull:['drill','pull']},TILE_N={latch:'Latch',drill:'Drill',pull:'Pull'};
